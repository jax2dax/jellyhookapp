<script>
/* ============================================================================================================
   THE WASTED DAY. 1080x1920, a pure function of time, locked to 11labs-wasted-day.mp3 by word timings.
   Beat sheet (every time below is looked up from the words, so a re-recorded voice re-times the film):
   0.34  "4pm"            clock lands 4:00 PM, queue starts, stress starts to rise      tick
   4.44  "one by one"     rows tick one at a time                                       tick x3
   6.10  "20"             the number slams, rows flip to "Let me think about it"        impact
   9.58  "4 buy ..."      four rows turn "Starter plan"                                 pop x4
   12.06 "then you hit"   push in on row 22, phone rings                                riser -> impact on "22"
   14.54 "generic opener" call opens, your script types, then gets cut off               typing ticks, glitch, impact
   20.82 the quote        Daniel's words light up one by one                              whoosh, riser, impact on "competitor"
   27.14 "just like that" the call collapses, LOST stamps on "gone"                      impact
   30.48 "because ..."    the morning fills with tire kickers                             tick per block
   35.74 "If you had"     the world flushes clean, the clock rolls back to 9:00 AM        whoosh, impact on "Jelly Hook"
   38.56 "this lead"      the SAME row opens into the lead: 3 visits, 5 minutes           pop x3, ticks
   44.84 "instant"        Slack card drops in, "Whale of the week"                        ding, ding
   49.06 "called him"     queue re-sorts, call connects, deal signs, the day is saved     whoosh, click, ding, impact
   54.26 "Stop dialing"   end card                                                        impact, pop
   ============================================================================================================ */

/* TikTok captions: 1 to 3 words at a time, the spoken word pops on a coloured pill, numbers get a beat of their own */
const isNum = w => /^\d+\.?$/.test(w);
const CHUNKS = [];
WORDS.forEach((w, i) => {
  const prev = WORDS[i - 1], cur = CHUNKS[CHUNKS.length - 1], num = isNum(w.w);
  if (!cur || cur.ids.length >= 3 || /[,.!?]$/.test(prev.w) || w.s - prev.e > .3 || num || cur.num) CHUNKS.push({ ids: [], num });
  CHUNKS[CHUNKS.length - 1].ids.push(i);
});
const capWrap = mk(stage, `left:30px;top:1440px;width:1020px;height:330px`);
CHUNKS.forEach(c => {
  c.el = mk(capWrap, `left:0;top:0;width:1020px;text-align:center;white-space:normal;transform-origin:50% 40%;display:none`);
  c.spans = c.ids.map(i => { const sp = document.createElement('span'); sp.textContent = WORDS[i].w.replace(/[,.]$/, '').replace(/^Hook$/, 'hook'); sp.style.cssText = `display:inline-block;white-space:nowrap;margin:4px 6px;padding:2px 18px 8px;border-radius:20px;font-size:${c.num ? 170 : 94}px;line-height:1.1;font-weight:700;letter-spacing:-.01em;transform-origin:50% 60%`; c.el.appendChild(sp); return sp; });
  c.a = WORDS[c.ids[0]].s; c.b = WORDS[c.ids[c.ids.length - 1]].e;
});

/* ---- the clock: minutes since midnight ---- */
const clockMin = t => {
  if (t < T.if_) return 960 + t * 0.34;                                   // 4:00 PM, creeping
  if (t < T.nine) return lerp(972, 540, ease(seg(t, T.if_, T.nine)));      // rolls back to 9:00 AM
  if (t < T.saved) return 540 + (t - T.nine) * 0.9;                        // 9:00 AM, creeping
  return lerp(540 + (T.saved - T.nine) * 0.9, 960, ease(seg(t, T.saved, T.day)));  // the day, saved
};
const fmt = m => { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; const h12 = ((h + 11) % 12) + 1; return `${h12}:${String(mm).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };

/* ---- the frame ---- */
function seek(t) {
  const rel = t >= T.jelly - 0.35, st = stress(t), md = mood(t);
  bg.style.background = mix(mix(PAPER_T, '#d6d1c6', lostK(t)), PAPER_R, md);
  const acc = mix(RED, GREEN, md);
  // camera: handheld while it hurts, steady once it works
  const shake = st * (1 - md) * 4.5;
  const zoom = 1 + .13 * ease(seg(t, T.hit, T.n22)) * (1 - seg(t, T.n22 + 0.2, T.n22 + 1)) + .07 * ease(seg(t, T.just, T.gone)) * (1 - seg(t, T.gone + .2, T.gone + 1.2)) + .035 * seg(t, T.jelly + 2, T.instant) * (1 - seg(t, T.instant, T.instant + .8));
  world.style.transform = `translate(${Math.sin(t * 13) * shake}px,${Math.sin(t * 17 + 2) * shake}px) scale(${zoom})`;
  vig.style.opacity = st * (1 - md) * .9;

  const hk = 1 - ease(seg(t, 2.3, 2.75));
  hook.style.opacity = hk; hook.style.transform = `translateY(${(1 - hk) * -180}px) scale(${1 + .04 * Math.max(0, Math.sin(t * 9)) * (t < 2.3 ? 1 : 0)})`;

  // HUD
  const hudOn = t < T.stop - 0.2;
  hud.style.opacity = hudOn ? Math.min(1, t / .25) * (1 - seg(t, T.stop - .4, T.stop - .1)) : 0;
  clockTxt.textContent = fmt(clockMin(t));
  const saved = t >= T.saved;
  clockTxt.style.color = saved ? GREEN : (md > .5 ? INK : RED);
  hudRule.style.background = md > .5 ? GREEN : INK;
  const calls = t < T.n22 ? Math.min(21, Math.floor(callFrac(t))) : 22;
  const closed = t >= T.deal;
  callLbl.textContent = closed ? 'DEALS CLOSED' : 'CALLS MADE';
  callNum.textContent = closed ? '1' : (t < T.if_ ? String(calls) : '22');
  callNum.style.color = closed ? GREEN : (md > .5 ? MUTE : INK);
  callSub.textContent = t > T.n22 && t < T.if_ ? '1 big deal lost' : '';
  callSub.style.color = RED;

  // the queue
  const p = scrollP(t), shift = whaleShift(t);
  const listOn = (t < T.n22 + 0.8 ? 1 : 0) * 1;
  let listOp;
  if (t < T.n22 + .6) listOp = 1;
  else if (t < T.just) listOp = .16;
  else if (t < T.because) listOp = lerp(.16, 1, seg(t, T.just, T.just + .5)) * (1 - seg(t, T.because - .1, T.because + .35));
  else if (t < T.jelly + 1.35) listOp = 0;
  else if (t < T.three) listOp = seg(t, T.jelly + 1.35, T.jelly + 2.0);
  else if (t < T.called - .6) listOp = .12;
  else if (t < T.stop - .3) listOp = lerp(.12, 1, seg(t, T.called - .6, T.called - .1));
  else listOp = 0;
  listOp *= (1 - seg(t, T.stop - .4, T.stop - .05)) * (1 - seg(t, T.saved - .15, T.saved + .12));
  listClip.style.opacity = listOp;
  listClip.style.display = listOp > .01 ? 'block' : 'none';
  if (listOp > .01) rows.forEach(({ r, av, nm, sb, ch, i }) => {
    let pos = i;
    if (t >= T.called - .2) pos = i === WHALE ? lerp(WHALE, 0, shift) : (i < WHALE ? i + shift : i);
    const y = 20 + (pos - p) * ROW;
    const tc = tcs[i], called = t >= tc, calling = t >= tc && t < tc + 0.38;
    let txt = '', bgc = 'transparent', col = MUTE, bd = '2px solid #b8b2a2';
    const sweep = T.think - 0.8 + i * 0.07, thinkOn = t >= Math.max(sweep, tc + .4) && t >= T.think - .8;
    const starterOn = STARTER.includes(i) && t >= T.n4 + STARTER.indexOf(i) * 0.4 && t >= tc;
    if (!rel) {
      if (i === WHALE) { txt = t < T.hit ? 'In queue' : (t < T.n22 + 1.0 ? 'Calling…' : 'On the call'); if (t >= T.hit) { bgc = INK; col = '#fff'; bd = 'none'; } }
      else if (!called) txt = 'In queue';
      else if (calling) { txt = 'Calling…'; bgc = INK; col = '#fff'; bd = 'none'; }
      else if (starterOn) { txt = 'Starter plan'; bgc = '#f2d98a'; col = '#6a4b00'; bd = 'none'; }
      else if (thinkOn) { txt = 'Let me think about it'; bgc = '#ddd7c8'; col = '#6b6556'; bd = 'none'; }
      else { txt = 'Called'; bgc = '#e8e4da'; col = '#555'; bd = 'none'; }
      if (i === WHALE && t >= T.gone) { txt = 'Lost'; bgc = RED; col = '#fff'; bd = 'none'; }
    } else {
      txt = i === WHALE ? '3 visits' : (i % 5 === 0 ? '2 visits' : '1 visit');
      bgc = i === WHALE ? '#dff0e5' : '#eef2ec'; col = i === WHALE ? GREEN : MUTE; bd = 'none';
      if (i === WHALE && t >= T.first && t < T.deal) { txt = 'On the call'; bgc = GREEN; col = '#fff'; }
      if (i === WHALE && t >= T.deal) { txt = 'Premium signed'; bgc = GREEN; col = '#fff'; }
    }
    ch.textContent = txt; ch.style.background = bgc; ch.style.color = col; ch.style.border = bd; ch.style.lineHeight = bd === 'none' ? '60px' : '56px';
    const hot = i === WHALE && ((t >= T.hit && t < T.if_) || t >= T.jelly + 1.2);
    r.style.top = y + 'px';
    r.style.borderColor = hot ? acc : INK;
    r.style.borderWidth = hot ? '5px' : '3px';
    r.style.transform = i === WHALE && t >= T.hit && t < T.n22 + 1 ? `scale(${1 + .03 * Math.sin((t - T.hit) * 14)})` : (calling ? 'translateX(10px)' : 'none');
    r.style.background = i === WHALE && t >= T.gone && !rel ? '#e9e4d8' : '#fff';
    r.style.opacity = (i === WHALE && t >= T.gone && !rel) ? .7 : 1;
    r.style.boxShadow = i === WHALE && rel && t >= T.jelly + 1.2 ? `0 0 0 8px rgba(15,122,61,${.12 + .08 * Math.sin(t * 6)})` : 'none';
    av.style.background = i === WHALE && rel ? GREEN : '#ddd7c8'; av.style.color = i === WHALE && rel ? '#fff' : MUTE;
    sb.textContent = i === WHALE && t >= T.biggest && t < T.if_ ? '' : (i === WHALE ? 'Enterprise inquiry' : SUBS[i % 4]);
  });

  // LOST stamp and the "biggest deal" tag sit on the lost row
  const wy = 250 + 20 + (WHALE - p) * ROW;
  const sp = spring(t - T.gone, 16, .5);
  stamp.style.display = t >= T.gone && t < T.because + .2 ? 'block' : 'none';
  stamp.style.top = (wy - 4) + 'px';
  stamp.style.opacity = t >= T.gone ? 1 - seg(t, T.because - .1, T.because + .2) : 0;
  stamp.style.transform = `rotate(-7deg) scale(${lerp(2.4, 1, clamp(sp))})`;
  dealTag.style.display = t >= T.biggest && t < T.because + .2 ? 'block' : 'none';
  dealTag.style.left = '176px'; dealTag.style.top = (wy + 76) + 'px';
  dealTag.style.opacity = (t >= T.biggest ? 1 : 0) * (1 - seg(t, T.because - .1, T.because + .2));

  const wsp = spring(t - T.deal, 16, .5), wop = t >= T.deal ? 1 - seg(t, Math.min(T.deal + 1.5, T.saved - .35), T.saved - .05) : 0;
  won.style.display = wop > .01 ? 'block' : 'none'; won.style.opacity = wop; won.style.top = (250 + 20 + (0 - p) * ROW - 4) + 'px';
  won.style.transform = `rotate(-6deg) scale(${lerp(2.4, 1, clamp(wsp))})`;

  // the call card
  const cIn = seg(t, T.hit + 0.9, T.n22 + 1.0), cOut = seg(t, T.just, T.just + .55);
  const cOp = ease(cIn) * (1 - ease(cOut));
  card.style.opacity = cOp; card.style.display = cOp > .01 ? 'block' : 'none';
  card.style.transform = `scale(${lerp(.9, 1, ease(cIn)) * lerp(1, .94, ease(cOut))})`;
  if (cOp > .01) {
    const secs = Math.max(0, t - (T.n22 + 1.1));
    cSub.textContent = t < T.n22 + 1.1 ? 'Ringing…' : `On the call · 0:${String(Math.floor(secs)).padStart(2, '0')}`;
    live.style.opacity = Math.sin(t * 7) > -.3 ? 1 : .55;
    const t1 = clamp((t - (T.generic - .85)) / 1.85), t2 = clamp((t - (T.pitch - .7)) / (T.cuts - .15 - (T.pitch - .7)));
    const n1 = Math.floor(YOU1.length * t1), n2 = Math.floor(YOU2.length * t2);
    bubbleYou1.textContent = YOU1.slice(0, n1);
    bubbleYou2.textContent = YOU2.slice(0, n2) + (t >= T.cuts ? '…' : '');
    bubbleYou1.style.display = n1 > 0 ? 'block' : 'none'; bubbleYou2.style.display = n2 > 0 ? 'block' : 'none'; youTag.style.display = n1 > 0 ? 'block' : 'none';
    const fade = lerp(1, .12, seg(t, T.q0 - .1, T.q0 + .35));
    bubbleYou1.style.opacity = fade; bubbleYou2.style.opacity = fade; youTag.style.opacity = fade;
    const hp = spring(t - T.cuts, 18, .55);
    hold.style.display = t >= T.cuts && t < T.q0 - .05 ? 'block' : 'none';
    hold.style.transform = `translateX(${lerp(-500, 0, clamp(hp, 0, 1.1))}px) rotate(-2deg)`;
    const gl = t >= T.cuts && t < T.cuts + .25 ? Math.sin(t * 90) * 12 : 0;
    bubbleYou2.style.transform = `translateX(${gl}px)`;
    const qp = spring(t - (T.q0 - .05), 14, .7);
    quote.style.display = t >= T.q0 - .05 ? 'block' : 'none';
    quote.style.transform = `scale(${lerp(.85, 1, clamp(qp, 0, 1.06))})`;
    qWords.forEach(({ s, w }) => { const on = t >= w.s - 0.02; s.style.opacity = on ? 1 : .16; s.style.color = on && QHOT.has(norm(w.w)) ? acc : INK; });
  }

  // the morning
  const savedPhase = t >= T.saved - .1;
  const calOp = Math.max(win(t, T.because - .05, T.if_ + .55, .35, .45), win(t, T.saved + .1, T.stop - .15, .3, .3));
  cal.style.opacity = calOp; cal.style.display = calOp > .01 ? 'block' : 'none';
  kicks.forEach(({ b, x, t: kt }) => {
    const a = spring(t - kt, 20, .75);
    const dead = seg(t, T.never, T.never + .8);
    b.style.opacity = clamp(a) * lerp(1, .38, dead);
    b.style.transform = `translateX(${(1 - clamp(a, 0, 1)) * 140}px)`;
    x.style.opacity = dead;
  });
  if (savedPhase) kicks.forEach(({ b }, i) => {
    const f = ease(seg(t, T.saved + .15 + i * .07, T.saved + .8 + i * .07));
    b.style.opacity = .38 * Math.pow(1 - f, 2); b.style.transform = `translateY(${f * 520}px) rotate(${f * (i % 2 ? 16 : -13)}deg)`;
  });
  const wb = clamp(spring(t - (T.saved + .3), 15, .6), 0, 1.08);
  winBlock.style.display = savedPhase ? 'block' : 'none';
  winBlock.style.opacity = clamp(wb * 2); winBlock.style.transform = `scale(${lerp(.8, 1, wb)})`;

  // the turn: a clean circle of light, the logo, then the same list in Jellyhook's colours
  const fr = ease(seg(t, T.if_ - .05, T.if_ + .85));
  flush.style.clipPath = `circle(${fr * 1500}px at 540px 880px)`;
  flush.style.opacity = 1 - seg(t, T.jelly + .6, T.jelly + 1.6);
  flush.style.display = t >= T.if_ - .06 && flush.style.opacity > .01 ? 'block' : 'none';
  // the logo and its name land on "Jelly Hook", then give way to the list
  const lg = spring(t - T.jelly, 14, .6), lo = (1 - seg(t, T.jelly + 1.25, T.jelly + 1.75)) * (t >= T.jelly - .05 ? 1 : 0);
  turn.style.opacity = lo; turn.style.display = lo > .01 ? 'block' : 'none';
  tLogo.style.transform = `scale(${lerp(.4, 1, clamp(lg, 0, 1.1))})`;
  tJelly.style.opacity = clamp(spring(t - T.jelly, 16, .7) * 1.4); tJelly.style.transform = `translateY(${(1 - clamp(spring(t - T.jelly, 14, .7), 0, 1)) * 40}px)`;
  tHook.style.opacity = clamp(spring(t - T.hook, 16, .7) * 1.4); tHook.style.transform = `translateY(${(1 - clamp(spring(t - T.hook, 14, .7), 0, 1)) * 40}px)`;

  // the lead profile (the same row, opened)
  const pIn = ease(seg(t, T.three - 1.15, T.three - .7)), pOut = ease(seg(t, T.called - .7, T.called - .15));
  const pOp = pIn * (1 - pOut);
  prof.style.opacity = pOp; prof.style.display = pOp > .01 ? 'block' : 'none';
  prof.style.transform = `translateY(${(1 - pIn) * 120}px)`;
  if (pOp > .01) {
    stats.forEach((s, i) => {
      const a = spring(t - s.tt, 18, .7);
      s.b.style.opacity = clamp(a); s.b.style.transform = `scale(${lerp(.85, 1, clamp(a, 0, 1.08))})`;
      if (i === 2) { const m = clamp((t - T.five) / (T.minutes + .7 - T.five)) * 5; s.v.textContent = `${Math.floor(m)}:${String(Math.floor((m % 1) * 60)).padStart(2, '0')} min`.replace(/^(\d):/, '$1:'); }
    });
    plates.forEach(({ pl, bands, entm, reach, t0 }) => {
      const a = spring(t - t0, 16, .72);
      pl.style.opacity = clamp(a * 1.5); pl.style.transform = `translateY(${(1 - clamp(a, 0, 1)) * 90}px)`;
      const fillK = ease(seg(t, t0 + .1, t0 + 1.0));
      bands.forEach(({ fill, start, h, bi }) => { const seen = clamp((reach * 500 - start) / h); fill.style.opacity = (bi === 3 ? .95 : .55) * fillK * (seen > 0 ? 1 : 0); fill.style.height = (h * (seen > 0 ? clamp(seen, 0, 1) : 0)) + 'px'; });
      entm.style.opacity = seg(t, T.minutes, T.minutes + .5) * (reach >= .8 ? 1 : 0);
    });
    const glow = Math.max(0, Math.sin(clamp((t - T.enterprise) / 1.3) * Math.PI)) * seg(t, T.enterprise - .05, T.enterprise);
    prof.style.boxShadow = `0 18px 0 rgba(15,122,61,.14), 0 0 ${60 * glow}px rgba(15,122,61,${.55 * glow})`;
    whalePill.style.opacity = clamp(spring(t - T.whale, 16, .6)); whalePill.style.transform = `scale(${lerp(1.7, 1, clamp(spring(t - T.whale, 16, .6), 0, 1.06))}) rotate(${lerp(-8, 0, clamp(spring(t - T.whale, 12, .8)))}deg)`;
    profNote.style.opacity = seg(t, T.features, T.features + .5);
  }

  // Slack
  const sIn = spring(t - T.instant, 15, .72), sOut = ease(seg(t, T.first - .9, T.first - .35));
  slack.style.top = lerp(-440, 78, clamp(sIn, 0, 1.08)) - sOut * 560 + 'px';
  const buzz = t >= T.instant && t < T.instant + .5 ? Math.sin(t * 80) * 5 * (1 - seg(t, T.instant, T.instant + .5)) : 0;
  slack.style.transform = `translateX(${buzz}px)`;
  slackPill.style.opacity = clamp(spring(t - T.whale, 16, .7)); slackPill.style.transform = `scale(${lerp(1.5, 1, clamp(spring(t - T.whale, 16, .7), 0, 1.06))})`;

  // captions
  const showCap = !(t > T.q0 - .15 && t < T.competitorEnd + .35) && t < T.stop - .1;
  CHUNKS.forEach((c, ci) => {
    const next = CHUNKS[ci + 1], endT = Math.min(c.b + .5, next ? next.a - .05 : 99);
    const on = showCap && t >= c.a - .07 && t < endT;
    c.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const k = clamp(spring(t - (c.a - .07), 24, .55), 0, 1.15);
    c.el.style.opacity = clamp(k * 2.5);
    c.el.style.transform = `translateY(${(1 - clamp(k)) * 50}px) scale(${lerp(.7, 1, k)})`;
    c.ids.forEach((i, j) => {
      const w = WORDS[i], sp = c.spans[j], said = t >= w.s - .03, cur = said && t < Math.max(w.e, w.s + .12) + .06;
      const pk = clamp(spring(t - (w.s - .03), 28, .45), 0, 1.25);
      sp.style.background = cur ? acc : 'transparent';
      sp.style.color = cur ? '#fff' : (said ? INK : 'rgba(17,17,17,.3)');
      sp.style.transform = cur ? `scale(${lerp(.86, 1.1, pk)}) rotate(${(j % 2 ? 1 : -1) * 1.5}deg)` : 'none';
    });
  });

  // closing
  const eOp = ease(seg(t, T.stop - .35, T.stop + .25));
  endLayer.style.opacity = eOp; endLayer.style.display = eOp > .01 ? 'block' : 'none';
  if (t >= T.stop - .4) {
    logoEl.style.transform = `scale(${lerp(.7, 1, clamp(spring(t - T.stop, 14, .7), 0, 1.06))})`;
    const hs = clamp(spring(t - T.stop, 13, .75), 0, 1.04);
    endHead.style.transform = `translateY(${(1 - hs) * 60}px)`;
    const bar = document.getElementById('blindbar'); bar.style.width = (ease(seg(t, T.blind, T.blind + .7)) * 100) + '%';
    endSub.style.opacity = seg(t, T.see - .1, T.see + .35); endSub.style.transform = `translateY(${(1 - seg(t, T.see - .1, T.see + .35)) * 24}px)`;
    const us = clamp(spring(t - T.jh, 15, .62), 0, 1.1); endUrl.style.opacity = clamp(us * 2); endUrl.style.transform = `scale(${lerp(.8, 1, us)})`;
    const fs = clamp(spring(t - T.free, 15, .62), 0, 1.1); endFree.style.opacity = clamp(fs * 2); endFree.style.transform = `scale(${lerp(.8, 1, fs)})`;
  }
  tag.style.opacity = t < T.stop - .2 ? .8 : 0;
}
window.seek = seek;
seek(0);

/* ---- live preview (not used by the renderer) ---- */
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 52) / H); stage.style.transform = `scale(${k})`; stage.style.left = Math.max(0, (innerWidth - W * k) / 2) + 'px'; };
  fit(); addEventListener('resize', fit);
  const ctl = document.createElement('div'); ctl.id = 'ctl';
  ctl.innerHTML = '<button id="pp">Play</button><input id="sc" type="range" min="0" max="' + DUR + '" step="0.01" value="0"><span id="tt">0.00</span>';
  document.body.appendChild(ctl);
  const au = new Audio('../../../../public/assets/11labs-wasted-day.mp3');
  const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
  let playing = false;
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; if (playing) { au.currentTime = +sc.value; au.play(); } else au.pause(); };
  sc.oninput = () => { au.currentTime = +sc.value; seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); };
  (function loop() { if (playing) { sc.value = au.currentTime; if (au.currentTime >= DUR) { playing = false; pp.textContent = 'Play'; } } seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); requestAnimationFrame(loop); })();
} else { stage.style.transform = 'none'; }
</script></body></html>
