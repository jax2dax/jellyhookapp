<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The wasted day</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*@FONTS@*/
html,body{margin:0;height:100%;background:#0b0b0a;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;font-family:'Albert Sans',system-ui,sans-serif;color:#111;font-variant-numeric:tabular-nums}

#stage .abs{position:absolute}
.serif{font-family:'Young Serif',Georgia,serif;font-weight:400}
.b{font-weight:700}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:#000a;color:#fff;font:14px system-ui;z-index:9}
#ctl input{flex:1}
</style></head><body>
<div id="stage"></div>
<script>
/* ============================================================================================================
   THE WASTED DAY. 1080x1920, a pure function of time, locked to 11labs-wasted-day.mp3 by word timings.
   Beat sheet (every time below is looked up from the words, so a re-recorded voice re-times the film):
   0.34  "4pm"            clock lands 4:00 PM, queue starts, stress starts to rise      tick
   4.44  "one by one"     rows tick one at a time                                       tick x3
   6.10  "20"             the number slams, rows flip to "Let me think about it"        impact
   9.58  "4 buy ..."      four rows turn "Starter plan"                                 pop x4
   12.06 "then you hit"   push in on row 22, phone rings                                riser -> impact on "22"
   14.54 "generic opener" call opens, your script types, then gets cut off               typing ticks, glitch, impact
   20.82 the quote        Daniel's words light up one by one                              whoosh, riser, impact on "competitor"
   27.14 "just like that" the call collapses, LOST stamps on "gone"                      impact
   30.48 "because ..."    the morning fills with tire kickers                             tick per block
   35.74 "If you had"     the world flushes clean, the clock rolls back to 9:00 AM        whoosh, impact on "Jelly Hook"
   38.56 "this lead"      the SAME row opens into the lead: 3 visits, 5 minutes           pop x3, ticks
   44.84 "instant"        Slack card drops in, "Whale of the week"                        ding, ding
   49.06 "called him"     queue re-sorts, call connects, deal signs, the day is saved     whoosh, click, ding, impact
   54.26 "Stop dialing"   end card                                                        impact, pop
   ============================================================================================================ */
const W = 1080, H = 1920, DUR = 63.0;
window.VIDEO = { w: W, h: H, duration: DUR };
const WORDS = /*@WORDS@*/null;
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const A = (w, after = 0) => { for (const x of WORDS) if (x.s >= after - 0.001 && norm(x.w) === norm(w)) return x.s; throw new Error('word not found: ' + w); };
const E = (w, after = 0) => { for (const x of WORDS) if (x.s >= after - 0.001 && norm(x.w) === norm(w)) return x.e; throw new Error('word not found: ' + w); };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
function spring(t, w = 14, z = 0.62) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const hex = c => c[0] === '#' ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).map(Number);
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',')})`; };
const win = (t, a, b, fi = 0.25, fo = 0.25) => clamp((t - a) / fi) * clamp((b - t) / fo);

/* ---- anchors from the voice ---- */
const T = {
  clock: A('4pm'), one: A('one', 4), n20: A('20'), think: A('let'), n4: A('4', 9), buy: A('buy'), cheapest: A('cheapest'), tier: A('tier'),
  hit: A('hit'), n22: A('22'), grind: A('grind'), generic: A('generic'), pitch: A('pitch'), premium: A('premium', 17), cuts: A('cuts'), off: A('off'),
  q0: A('I', 20), q_premium: A('premium', 21), nobody: A('nobody'), competitor: A('competitor'), competitorEnd: E('competitor'),
  just: A('Just'), biggest: A('biggest'), gone: A('gone'), because: A('because'), tire: A('tire'), kickers: A('kickers'), never: A('never'), buy2: A('buy', 34),
  if_: A('If'), jelly: A('Jelly'), hook: A('Hook'), nine: A('9am'), three: A('3'), times: A('times'), five: A('5'), minutes: A('minutes'),
  enterprise: A('enterprise'), features: A('features'), instant: A('instant'), whale: A('whale'), called: A('called', 49), first: A('first', 49),
  closed: A('closed'), deal: A('deal', 51), saved: A('saved'), day: A('day', 52), stop: A('Stop'), blind: A('blind'), see: A('See'), jh: A('jellyhook'), free: A('free'),
  end: 62.04,
};

/* ---- state ---- */
const INK = '#111111', PAPER_T = '#ece6da', PAPER_R = '#f7f9f4', RED = '#c2410c', GREEN = '#0f7a3d', MUTE = '#6a655a';
const mood = kf([[0, 0], [T.if_ + 0.5, 0], [T.jelly + 0.25, 1]]);      // 0 tense, 1 relief
const stress = kf([[0, .08], [12, .35], [19.7, .8], [T.gone, 1], [T.because, .65], [T.if_, .9], [T.jelly, 0]]);
const lostK = t => seg(t, T.gone, T.gone + .7) * (1 - seg(t, T.if_, T.jelly));

/* ---- dom helpers ---- */
const stage = document.getElementById('stage');
function mk(parent, css, html = '', cls = '') { const d = document.createElement('div'); d.className = 'abs ' + cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d; }
const bg = mk(stage, `left:0;top:0;width:${W}px;height:${H}px`);
const world = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;transform-origin:540px 760px`);
const hud = mk(stage, `left:0;top:0;width:${W}px;height:240px`);
const vig = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(120,30,0,0) 45%,rgba(120,30,0,.55) 100%)`);
const flush = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;background:#f7f9f4;clip-path:circle(0px at 540px 880px)`);
const turn = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;pointer-events:none`);
const tLogo = mk(turn, `left:400px;top:520px;width:280px;height:280px;transform-origin:50% 60%`, '<img src="@LOGO@" style="width:280px;height:280px">');
const tJelly = mk(turn, `left:0;top:840px;width:540px;text-align:right;font-size:124px;line-height:1.1;transform-origin:100% 50%`, 'Jelly', 'serif');
const tHook = mk(turn, `left:540px;top:840px;width:540px;text-align:left;font-size:124px;line-height:1.1;color:#0f7a3d;transform-origin:0 50%`, 'hook', 'serif');
const endLayer = mk(stage, `left:0;top:0;width:${W}px;height:${H}px`);
const slack = mk(stage, `left:60px;top:-420px;width:960px;height:380px;background:#fff;border:3px solid ${INK};border-radius:28px;box-shadow:0 18px 0 rgba(0,0,0,.12)`);
const tag = mk(stage, `left:0;top:1868px;width:${W}px;text-align:center;font-size:22px;color:${MUTE};letter-spacing:.14em;text-transform:uppercase`, 'Example leads, not real people');

const hook = mk(stage, `left:60px;top:64px;width:960px;height:128px;border-radius:30px;background:${INK};color:#fff;font-size:56px;line-height:128px;text-align:center`, '22 calls. 1 big deal lost.', 'b');

/* HUD */
const hudRule = mk(hud, `left:60px;top:214px;width:960px;height:4px;background:${INK}`);
const clockBox = mk(hud, `left:60px;top:70px;width:380px;height:112px;background:#fff;border:3px solid ${INK};border-radius:26px`);
mk(clockBox, `left:26px;top:14px;font-size:22px;letter-spacing:.16em;color:${MUTE}`, 'RIGHT NOW', 'b');
const clockTxt = mk(clockBox, `left:26px;top:38px;font-size:60px;line-height:1`, '', 'b');
const callBox = mk(hud, `left:560px;top:70px;width:460px;height:112px;background:#fff;border:3px solid ${INK};border-radius:26px`);
const callLbl = mk(callBox, `left:26px;top:14px;font-size:22px;letter-spacing:.16em;color:${MUTE}`, 'CALLS MADE', 'b');
const callNum = mk(callBox, `left:26px;top:38px;font-size:60px;line-height:1`, '0', 'b');
const callSub = mk(callBox, `right:26px;top:44px;font-size:26px;color:${MUTE}`, '', 'b');

/* the queue (the same list, before and after the turn) */
const NAMES = ['Dana K.', 'Marcus R.', 'Priya S.', 'Tom B.', 'Elena V.', 'Chris L.', 'Aisha M.', 'Jordan P.', 'Sofia G.', 'Ben H.', 'Mei W.', 'Luis F.', 'Hannah T.', 'Omar D.', 'Nina C.', 'Paul E.', 'Grace O.', 'Ivan Z.', 'Kara N.', 'Sam Y.', 'Lucy A.', 'Daniel Okafor', 'Rita J.', 'Theo B.', 'Mona K.', 'Jay P.'];
const SUBS = ['Pricing form', 'Contact form', 'Demo request', 'Quote request'];
const WHALE = 21, STARTER = [3, 8, 13, 17];
const listClip = mk(world, `left:0;top:250px;width:${W}px;height:1130px;overflow:hidden`);
const ROW = 146;
// each row is called in turn: slow at first (one by one), then faster
const tcs = NAMES.map((_, i) => i < 8 ? 0.8 + i * 0.62 : i < 21 ? 6.1 + (i - 8) * 0.27 : 14.4 + (i - 21) * 99);
const rows = NAMES.map((n, i) => {
  const r = mk(listClip, `left:60px;top:0;width:960px;height:128px;background:#fff;border:3px solid ${INK};border-radius:22px`);
  const ini = n.split(' ').map(s => s[0]).join('');
  const av = mk(r, `left:22px;top:24px;width:76px;height:76px;border-radius:50%;background:#ddd7c8;font-size:30px;text-align:center;line-height:76px;color:${MUTE}`, ini, 'b');
  const nm = mk(r, `left:120px;top:22px;font-size:38px;line-height:1.1`, n, 'b');
  const sb = mk(r, `left:120px;top:72px;font-size:27px;color:${MUTE}`, i === WHALE ? 'Enterprise inquiry' : SUBS[i % 4], '');
  const ch = mk(r, `right:22px;top:32px;height:60px;border-radius:30px;padding:0 24px;font-size:28px;line-height:56px`, '', 'b');
  return { r, av, nm, sb, ch, i };
});
const callFrac = t => tcs.reduce((s, tc, i) => s + (i <= WHALE - 1 ? clamp((t - tc) / 0.3) : 0), 0);   // rows 0..20 only
const scrollP = t => {
  if (t < T.hit) return Math.max(0, callFrac(t) - 3.5);
  const base = Math.max(0, callFrac(T.hit) - 3.5);
  const toWhale = lerp(base, 18.3, ease(seg(t, T.hit, T.n22)));
  if (t < 48.9) return toWhale;
  return lerp(18.3, 0, ease(seg(t, 48.9, 49.8)));
};
const whaleShift = t => ease(seg(t, T.called - 0.2, T.called + 0.5));

/* the call card (row 22 opened) */
const card = mk(world, `left:60px;top:300px;width:960px;height:900px;background:#fff;border:3px solid ${INK};border-radius:30px;box-shadow:0 18px 0 rgba(0,0,0,.10);transform-origin:50% 8%`);
const cAv = mk(card, `left:34px;top:30px;width:96px;height:96px;border-radius:50%;background:#ddd7c8;font-size:38px;text-align:center;line-height:96px;color:${MUTE}`, 'DO', 'b');
mk(card, `left:156px;top:30px;font-size:46px;line-height:1.1`, 'Daniel Okafor', 'b');
const cSub = mk(card, `left:156px;top:90px;font-size:28px;color:${RED}`, '', 'b');
const live = mk(card, `right:34px;top:48px;height:56px;border-radius:28px;padding:0 24px;background:${RED};color:#fff;font-size:26px;line-height:56px;letter-spacing:.08em`, 'LIVE', 'b');
const bubbleYou1 = mk(card, `right:34px;top:190px;width:700px;white-space:normal;background:${INK};color:#fff;border-radius:28px 28px 6px 28px;padding:26px 30px;font-size:35px;line-height:1.3;min-height:120px`);
const bubbleYou2 = mk(card, `right:34px;top:430px;width:700px;white-space:normal;background:${INK};color:#fff;border-radius:28px 28px 6px 28px;padding:26px 30px;font-size:35px;line-height:1.3;min-height:120px`);
const youTag = mk(card, `right:44px;top:150px;font-size:22px;letter-spacing:.14em;color:${MUTE}`, 'YOU', 'b');
const hold = mk(card, `left:34px;top:660px;background:#fff;border:3px solid ${RED};color:${RED};border-radius:28px 28px 28px 6px;padding:20px 34px;font-size:46px`, 'Hold on.', 'b');
const quote = mk(card, `left:34px;top:190px;width:892px;white-space:normal;background:#fff;border:3px solid ${INK};border-radius:30px 30px 30px 8px;padding:34px 38px;font-size:72px;line-height:1.16`, '', 'serif');
const qWords = [];
{ let on = false; for (const x of WORDS) { if (x.s >= T.q0 - .001 && x.s <= T.competitor + .001) { const s = document.createElement('span'); s.textContent = x.w + ' '; s.style.cssText = 'white-space:normal'; quote.appendChild(s); qWords.push({ s, w: x }); } } }
const QHOT = new Set(['premium', 'plan', 'nobody', 'called', 'back', 'competitor']);

const YOU1 = "Hi Daniel, thanks so much for your interest! We have three plans, so let me walk you through all of them.";
const YOU2 = "Our Premium service is a great fit for growing teams, and if you would like to hear a bit more about";

/* the lost row's stamp */
const stamp = mk(world, `left:300px;top:0;width:480px;height:130px;border:8px solid ${RED};color:${RED};border-radius:18px;font-size:92px;line-height:112px;text-align:center;letter-spacing:.06em;transform-origin:50% 50%;background:rgba(255,255,255,.55)`, 'LOST', 'b');
const dealTag = mk(world, `left:0;top:0;height:46px;border-radius:23px;padding:0 20px;background:#f2d98a;color:#6a4b00;font-size:25px;line-height:46px`, 'Biggest deal of the week', 'b');

const won = mk(world, `left:260px;top:0;width:560px;height:130px;border:8px solid ${GREEN};color:${GREEN};border-radius:18px;font-size:92px;line-height:112px;text-align:center;letter-spacing:.06em;transform-origin:50% 50%;background:rgba(255,255,255,.7)`, 'SIGNED', 'b');
/* the morning (tire kickers) */
const cal = mk(world, `left:60px;top:270px;width:960px;height:1090px`);
mk(cal, `left:0;top:0;font-size:60px`, 'Your morning', 'serif');
['9 AM', '10 AM', '11 AM', '12 PM'].forEach((l, i) => { mk(cal, `left:0;top:${140 + i * 240}px;width:960px;height:2px;background:#bdb6a4`); mk(cal, `left:0;top:${150 + i * 240}px;font-size:26px;color:${MUTE}`, l, 'b'); });
const KICK = ['Quick question', 'Just browsing', 'Pricing? Maybe later', 'Is there a free plan?', 'Send me a PDF', 'Call me next month', 'Who is this?', 'Just looking around', 'What do you do?', 'Any discount?'];
const kicks = KICK.map((k, i) => {
  const y = 150 + i * 92;
  const b = mk(cal, `left:150px;top:${y}px;width:790px;height:78px;border:3px solid ${INK};border-radius:18px;background:#e8e2d3;font-size:34px;line-height:72px;padding-left:28px`, k, 'b');
  const x = mk(b, `right:22px;top:0;font-size:44px;color:${RED}`, '×', 'b');
  return { b, x, t: lerp(T.because + .1, T.never - .3, i / 9) };
});

const winBlock = mk(cal, `left:150px;top:150px;width:790px;height:78px;border:3px solid ${GREEN};border-radius:18px;background:${GREEN};color:#fff;font-size:34px;line-height:72px;padding-left:28px`, 'Daniel Okafor · Premium signed', 'b');

/* the lead profile */
const prof = mk(world, `left:60px;top:300px;width:960px;height:1010px;background:#fff;border:3px solid ${GREEN};border-radius:30px;box-shadow:0 18px 0 rgba(15,122,61,.14)`);
mk(prof, `left:34px;top:30px;width:96px;height:96px;border-radius:50%;background:${GREEN};color:#fff;font-size:38px;text-align:center;line-height:96px`, 'DO', 'b');
mk(prof, `left:156px;top:28px;font-size:46px;line-height:1.1`, 'Daniel Okafor', 'b');
mk(prof, `left:156px;top:90px;font-size:27px;color:${MUTE}`, 'Enterprise inquiry · came from a search', '');
const whalePill = mk(prof, `right:34px;top:44px;height:60px;border-radius:30px;padding:0 26px;background:${GREEN};color:#fff;font-size:29px;line-height:60px`, 'Whale of the week', 'b');
const stats = [['Visits', '3', T.three], ['Pricing page', '3 times', T.times], ['On Enterprise', '', T.five]].map(([lab, val, tt], i) => {
  const b = mk(prof, `left:${34 + i * 300}px;top:164px;width:276px;height:132px;background:#eef2ec;border-radius:22px`);
  mk(b, `left:22px;top:16px;font-size:23px;letter-spacing:.12em;color:${MUTE}`, lab.toUpperCase(), 'b');
  const v = mk(b, `left:22px;top:52px;font-size:58px;line-height:1.1;color:${GREEN}`, val, 'b');
  return { b, v, tt };
});
const VIS = [['Visit 1 · Sunday', 0.55, '1 min'], ['Visit 2 · Monday', 0.82, '2 min'], ['Visit 3 · today 8:41', 1, '2 min']];
const BANDS = [['Hero', 90], ['Pricing', 150], ['Plans', 110], ['Enterprise', 150], ['FAQ', 70]];
const plates = VIS.map(([lab, reach, tm], i) => {
  const x = 34 + i * 300;
  const pl = mk(prof, `left:${x}px;top:330px;width:276px;height:600px;transform-origin:50% 100%`);
  mk(pl, `left:0;top:0;font-size:24px;color:${MUTE}`, lab, 'b');
  const frame = mk(pl, `left:0;top:40px;width:276px;height:500px;border:3px solid ${INK};border-radius:18px;overflow:hidden;background:#fff`);
  let y = 0; const bands = [];
  BANDS.forEach(([n, h], bi) => {
    const hh = h * 500 / 570;
    const b = mk(frame, `left:0;top:${y}px;width:276px;height:${hh}px;border-bottom:2px solid #e4e0d4;font-size:24px;padding:10px 16px;color:${MUTE}`, n, 'b');
    const fill = mk(b, `left:0;top:0;width:276px;height:${hh}px;background:${bi === 3 ? GREEN : '#9fd2b2'};opacity:0`);
    bands.push({ fill, start: y, h: hh, bi }); y += hh;
  });
  const entm = mk(pl, `left:0;top:552px;font-size:26px;color:${GREEN}`, 'Enterprise ' + tm, 'b');
  return { pl, bands, entm, reach, t0: [T.three, T.times, T.times + 0.42][i] };
});
const profNote = mk(prof, `left:34px;top:944px;font-size:26px;color:${MUTE}`, 'Pages, time, scroll and headings reached, for every visit.', '');

/* Slack card */
mk(slack, `left:0;top:0;width:960px;height:62px;background:#e8590c;border-radius:25px 25px 0 0`);
mk(slack, `left:26px;top:11px;color:#fff;font-size:28px;letter-spacing:.06em`, 'SLACK  ·  #hot-leads', 'b');
mk(slack, `left:26px;top:96px;width:84px;height:84px;border-radius:20px;background:${GREEN};overflow:hidden`, '<img src="@LOGO@" style="position:absolute;left:-6px;top:-8px;width:96px;height:96px">');
mk(slack, `left:130px;top:92px;font-size:34px`, 'Jellyhook <span style="font-weight:500;color:#6a655a;font-size:26px">APP  9:02 AM</span>', 'b');
mk(slack, `left:130px;top:140px;font-size:42px`, 'New lead: Daniel Okafor', 'b');
const slackPill = mk(slack, `left:130px;top:208px;height:54px;border-radius:27px;padding:0 22px;background:${GREEN};color:#fff;font-size:28px;line-height:54px`, 'Whale of the week', 'b');
mk(slack, `left:26px;top:286px;font-size:30px;color:${INK}`, '3 visits  ·  Pricing 3 times  ·  5 min on Enterprise', '');
mk(slack, `left:26px;top:328px;font-size:24px;color:${MUTE}`, 'Open lead  ·  Call now', 'b');

/* closing */
const logoEl = mk(endLayer, `left:420px;top:330px;width:240px;height:240px`, '<img src="@LOGO@" style="width:240px;height:240px">');
const endHead = mk(endLayer, `left:0;top:620px;width:${W}px;text-align:center;font-size:132px;line-height:1.05`, 'Stop dialing<br><span id="blindw" style="position:relative;display:inline-block">blind.<span id="blindbar" style="position:absolute;left:0;bottom:6px;height:22px;width:0;background:#9fd2b2;z-index:-1;white-space:normal"></span></span>', 'serif');
const endSub = mk(endLayer, `left:0;top:1090px;width:${W}px;text-align:center;font-size:48px;color:${MUTE}`, 'See how it works on sample leads.', 'b');
const endUrl = mk(endLayer, `left:210px;top:1200px;width:660px;height:128px;border-radius:64px;background:${GREEN};color:#fff;font-size:68px;line-height:128px;text-align:center`, 'jellyhook.com', 'b');
const endFree = mk(endLayer, `left:210px;top:1390px;width:660px;height:96px;border-radius:48px;border:3px solid ${GREEN};color:${GREEN};font-size:40px;line-height:90px;text-align:center`, 'Free during early access', 'b');

/* TikTok captions: 1 to 3 words at a time, the spoken word pops on a coloured pill, numbers get a beat of their own */
const isNum = w => /^\d+\.?$/.test(w);
const CHUNKS = [];
WORDS.forEach((w, i) => {
  const prev = WORDS[i - 1], cur = CHUNKS[CHUNKS.length - 1], num = isNum(w.w);
  if (!cur || cur.ids.length >= 3 || /[,.!?]$/.test(prev.w) || w.s - prev.e > .3 || num || cur.num) CHUNKS.push({ ids: [], num });
  CHUNKS[CHUNKS.length - 1].ids.push(i);
});
const capWrap = mk(stage, `left:30px;top:1440px;width:1020px;height:330px`);
CHUNKS.forEach(c => {

/* ---- live preview (not used by the renderer) ---- */
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 52) / H); stage.style.transform = `scale(${k})`; stage.style.left = Math.max(0, (innerWidth - W * k) / 2) + 'px'; };
  fit(); addEventListener('resize', fit);
  const ctl = document.createElement('div'); ctl.id = 'ctl';
  ctl.innerHTML = '<button id="pp">Play</button><input id="sc" type="range" min="0" max="' + DUR + '" step="0.01" value="0"><span id="tt">0.00</span>';
  document.body.appendChild(ctl);
  const au = new Audio('../../../../public/assets/11labs-wasted-day.mp3');
  const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
  let playing = false;
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; if (playing) { au.currentTime = +sc.value; au.play(); } else au.pause(); };
  sc.oninput = () => { au.currentTime = +sc.value; seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); };
  (function loop() { if (playing) { sc.value = au.currentTime; if (au.currentTime >= DUR) { playing = false; pp.textContent = 'Play'; } } seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); requestAnimationFrame(loop); })();
} else { stage.style.transform = 'none'; }
</script></body></html>
