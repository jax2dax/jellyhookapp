const isNum = w => /^\$?\d+[,.]?\d*$/.test(w);

  document.getElementById('sigPath').setAttribute('stroke-dashoffset', 520 * (1 - ease(seg(t, T.close + .05, E('contract') - .05))));
  const st = spring(t - (E('contract') - .05), 17, .5);
  stamp.style.opacity = clamp(st * 2); stamp.style.transform = `rotate(-8deg) scale(${lerp(2.2, 1, clamp(st, 0, 1.1))})`;
  const sp2 = t >= T.spam;
  side.forEach((s, i) => { const hot = i === 3 && sp2; s.style.background = hot ? 'rgba(244,114,182,.3)' : 'transparent'; s.style.color = hot ? '#fff' : MUTE; });
  junk.forEach((j, i) => { const k = seg(t, T.spam + .1 + i * .06, T.spam + .4 + i * .06); j.style.opacity = k; j.style.transform = `translateY(${(1 - k) * 18}px)`; });
  spin.style.opacity = sp2 ? 0 : seg(t, T.competitor + .3, T.competitor + .6); spin.style.transform = `rotate(${t * 420}deg)`;
  const mc = ease(seg(t, T.competitor + .8, T.spam));
  X(mcursor, c9, lerp(520, 84, mc), lerp(300, 64 + 3 * 62 + 14, mc), 1, 0);
  zz.forEach((z, i) => { z.style.opacity = seg(t, T.spam + i * .15, T.spam + .3 + i * .15) * (.5 + .5 * Math.sin(t * 3 + i)); });

  /* scene 10: the funnel ------------------------------------------------------------------ */
  const f10 = win(t, T.stop - .05, T.find2 - .2, .3, .35);
  const stp = spring(t - T.stop, 14, .55), stOut = ease(seg(t, T.stop + .55, T.stop + 1.0));
  X(stopSign, (clamp(stp * 2) * (1 - stOut)) * (t < T.digging + .4 ? 1 : 0), 0, 0, lerp(.3, 1, clamp(stp, 0, 1.15)) * lerp(1, .5, stOut), 0);
  X(funnel, f10 * ease(seg(t, T.stop + .4, T.stop + .9)), 0, 0, 1, 0);
  X(trayB, f10 * ease(seg(t, T.stop + .5, T.stop + 1.0)), 0, 0, 1, 0);
  noiseCards.forEach(n => {
    const t0 = T.digging + .12 + n.i * ((T.best - .5 - T.digging) / 16), u = (t - t0);
    const fall = clamp(u / 1.0);
    const sx = 540 + (n.i % 5 - 2) * 80; let x = sx - 75, y = 300 + fall * 330;
    // lands on the slope, then slides off to its side
    const slide = clamp((u - .7) / .7);
    x += n.side * slide * 360; y += slide * slide * 700;
    X(n.el, (u > 0 && u < 2.0 ? 1 : 0) * f10 * (1 - clamp((u - 1.4) / .5)), x, y - 0, 1, n.side * slide * 40);
    n.el.style.left = '0px'; n.el.style.top = '0px';
  });
  dust.forEach(d => { const k = seg(t, T.digging + d.i * .06, T.digging + 1.6 + d.i * .06); const sd = d.i % 2 ? 1 : -1; X(d.el, (k > 0 && k < 1 ? .7 * (1 - k) : 0) * f10, 540 + sd * (80 + k * 300 + (d.i % 5) * 20), 900 + k * 220 + (d.i % 7) * 12, 1, 0); d.el.style.left = '0px'; d.el.style.top = '0px'; });
  const bc = seg(t, T.best - .25, T.buyers + .1);
  const bcy = bc < .45 ? lerp(240, 700, ease(bc / .45)) : lerp(700, 1130, ease((bc - .45) / .55));
  X(bigCard, f10 * (t >= T.best - .3 ? 1 : 0), 540 - 105, bcy, lerp(1, .95, bc), 0);
  bigCard.style.left = '0px'; bigCard.style.top = '0px';

  /* scene 11 ------------------------------------------------------------------------------------- */
  const e = ease(seg(t, T.find2 - .2, T.find2 + .35));
  X(endL, e, 0, 0, 1, 0);
  const el_ = spring(t - T.find2, 12, .65);
  endLogo.style.transform = `scale(${lerp(.5, 1, clamp(el_, 0, 1.08))})`; endWord.style.transform = `translateY(${(1 - clamp(spring(t - T.find2 - .1, 13, .7), 0, 1)) * 60}px)`;
  const us = clamp(spring(t - T.jh, 14, .6), 0, 1.1); endUrl.style.opacity = clamp(us * 2); endUrl.style.transform = `scale(${lerp(.8, 1, us)})`;
  const fs = clamp(spring(t - T.free, 14, .6), 0, 1.1); endFree.style.opacity = clamp(fs * 2); endFree.style.transform = `scale(${lerp(.8, 1, fs)})`;
  endGlow.style.transform = `scale(${1 + .06 * Math.sin(t * 2)})`;

  /* captions ------------------------------------------------------------------------------------- */
  const showCap = t < T.find2 - .3 || t > T.free - .1 ? t < DUR : (t < T.find2 + .2 ? 0 : 1);
  const capOn = t < T.find2 - .35 ? 1 : (t >= T.find2 - .2 ? (t < T.free - .15 ? 1 : 1) : 0);
  scrim.style.opacity = 1;
  CHUNKS.forEach((c, ci) => {
    const next = CHUNKS[ci + 1], endT = Math.min(c.b + .5, next ? next.a - .05 : 99);
    const on = t >= c.a - .07 && t < endT && (t < T.find2 - .1 || t >= T.find2 - .1) && c.a < 41.9;
    c.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const k = clamp(spring(t - (c.a - .07), 24, .55), 0, 1.15);
    c.el.style.opacity = clamp(k * 2.5);
    c.el.style.transform = `translateY(${(1 - clamp(k)) * 50}px) scale(${lerp(.7, 1, k)})`;
    const acc = accAt(c.a);
    c.ids.forEach((i, j) => {
      const w = WORDS[i], sp = c.spans[j], said = t >= w.s - .03, cur = said && t < Math.max(w.e, w.s + .12) + .06;
      const pk = clamp(spring(t - (w.s - .03), 28, .45), 0, 1.25);
      sp.style.background = cur ? acc : 'transparent';
      sp.style.color = cur ? '#0b1537' : (said ? WHITE : 'rgba(238,242,255,.32)');
      sp.style.transform = cur ? `scale(${lerp(.86, 1.1, pk)}) rotate(${(j % 2 ? 1 : -1) * 1.5}deg)` : 'none';
    });
  });
  tag.style.opacity = t < T.find2 - .3 ? .7 : 0;
}
window.seek = seek;
seek(0);

/* ---- live preview (not used by the renderer) ---- */
if (!location.search.includes('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 52) / H); stage.style.transform = `scale(${k})`; stage.style.left = Math.max(0, (innerWidth - W * k) / 2) + 'px'; };
  fit(); addEventListener('resize', fit);
  const ctl = document.createElement('div'); ctl.id = 'ctl';
  ctl.innerHTML = '<button id="pp">Play</button><input id="sc" type="range" min="0" max="' + DUR + '" step="0.01" value="0"><span id="tt">0.00</span>';
  document.body.appendChild(ctl);
  const au = new Audio('../../../../public/assets/set-rules.mp3');
  const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
  let playing = false;
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; if (playing) { au.currentTime = +sc.value; au.play(); } else au.pause(); };
  sc.oninput = () => { au.currentTime = +sc.value; seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); };
  (function loop() { if (playing) { sc.value = au.currentTime; if (au.currentTime >= DUR) { playing = false; pp.textContent = 'Play'; } } seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); requestAnimationFrame(loop); })();
} else { stage.style.transform = 'none'; }
