<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Set the rules</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*@FONTS@*/
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;font-family:'Space Grotesk',system-ui,sans-serif;color:#eef2ff;font-variant-numeric:tabular-nums}
#stage *{box-sizing:border-box;white-space:nowrap}
#stage .abs{position:absolute}
.b{font-weight:700}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:#000a;color:#fff;font:14px system-ui;z-index:9}
#ctl input{flex:1}
</style></head><body>
<div id="stage"></div>
<script>
/* ============================================================================================================
   SET THE RULES. 1080x1920, a pure function of time, locked to set-rules.mp3 by word timings.
   Palette: deep sea. Navy ground, cyan and violet light, pink for noise and loss, mint for the win. No orange.
   Every line gets a picture, not a caption:
   0.2   "50 inbound submissions"  fifty cards rain into a pile, a comb drags through, a search light finds nothing
   5.14  "you set the exact rules" the pile blows away, the logo lands, three dials are set
   7.6   "what high intent looks like" the ideal lead draws itself and checks off
   9.32  "pings you ... a whale"    radar ping, a whale breaches and dives into the inbox
   12.32 "for example, tell ..."   voice bar, a $4,000 meter, a timer ring on the enterprise page, a submit click: the rule builds itself
   22.94 "alert hits your phone"   phone rises, buzzes, the alert drops
   24.44 "skip the 50 tire kickers" the pile comes back and is swiped away, a tyre kicks it out
   26.3  "dial ... within 90 sec"   the call button, a lock-on, a 90 second ring
   29.04 "close ... while your competitor" a contract signs while their spam folder loads
   33.42 "stop digging through noise" a funnel lets only the best buyer through
   36.98 jellyhook.com, free on early access
   ============================================================================================================ */
const W = 1080, H = 1920, DUR = 42.6;
window.VIDEO = { w: W, h: H, duration: DUR };
const WORDS = /*@WORDS@*/null;
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const A = (w, after = 0) => { for (const x of WORDS) if (x.s >= after - 0.001 && norm(x.w) === norm(w)) return x.s; throw new Error('word not found: ' + w); };
const E = (w, after = 0) => { for (const x of WORDS) if (x.s >= after - 0.001 && norm(x.w) === norm(w)) return x.e; throw new Error('word not found: ' + w); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outC = x => 1 - Math.pow(1 - clamp(x), 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .25, fo = .25) => clamp((t - a) / fi) * clamp((b - t) / fo);
function spring(t, w = 14, z = .62) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);

/* ---- anchors from the voice ---- */
const T = {
  n50: A('50'), comb: A('comb'), hoping: A('hoping'), bigdeal: A('big'),
  with_: A('With'), set: A('set'), exact: A('exact'), rules: A('rules'), high: A('high'), intent: A('intent'), looks: A('looks'),
  pings: A('pings'), whale: A('whale'), inbox: A('inbox'),
  example: A('For', 12), tell: A('tell'), only: A('only'), immediately: A('immediately'), if_: A('if'), budget: A('budget'), over: A('over'), n4: A('4'), k000: A('000'),
  and2: A('and', 17.5), spent: A('spent'), least: A('least'), three: A('three'), minutes: A('minutes'), enterprise: A('enterprise'), services: A('services'), page: A('page', 21), before: A('before'), submitting: A('submitting'), submittingEnd: E('submitting'),
  when: A('When'), alert2: A('alert', 23), hits2: A('hits', 23), phone: A('phone'),
  skip: A('skip'), n50b: A('50', 24), tire: A('tire'), kickers: A('kickers'),
  dial: A('dial'), exact2: A('exact', 26), right: A('right'), buyer: A('buyer'), n90: A('90'), seconds: A('seconds'),
  close: A('close'), contract: A('contract'), competitor: A('competitor'), spam: A('spam'), folder: A('folder'),
  stop: A('Stop'), digging: A('digging'), low: A('low'), noise: A('noise'), find: A('find', 35), best: A('best'), buyers: A('buyers'),
  find2: A('Find', 36), jh: A('jellyhook', 36), free: A('free'), early: A('Early'),
};

/* ---- palette ---- */
const BG0 = '#050816', BG1 = '#0b1537', WHITE = '#eef2ff', MUTE = '#8b97c9', CYAN = '#22d3ee', VIOLET = '#8b5cf6', PINK = '#f472b6', MINT = '#34d399', SLATE = '#64748b';
const GLASS = 'background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);backdrop-filter:none;';

/* ---- dom helpers ---- */
const stage = document.getElementById('stage');
function mk(parent, css, html = '', cls = '') { const d = document.createElement('div'); d.className = 'abs ' + cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d; }
function X(el, o = 1, x = 0, y = 0, s = 1, r = 0) { el.style.opacity = o; el.style.display = o > .005 ? 'block' : 'none'; el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; }
const svg = (w, h, inner, vb) => `<svg width="${w}" height="${h}" viewBox="${vb || `0 0 ${w} ${h}`}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">${inner}</svg>`;

/* ---- layers ---- */
const bg = mk(stage, `left:0;top:0;width:${W}px;height:${H}px`);
const rays = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;opacity:.5;mix-blend-mode:screen`);
const rr = rng(7);
const RAYS = Array.from({ length: 6 }, (_, i) => mk(rays, `left:${60 + i * 190}px;top:-200px;width:120px;height:1500px;background:linear-gradient(180deg,rgba(34,211,238,.22),rgba(34,211,238,0));transform-origin:50% 0;filter:blur(8px)`));
const BUB = Array.from({ length: 36 }, () => ({ x: rr() * W, sp: 40 + rr() * 90, r: 4 + rr() * 14, ph: rr() * 9, el: null }));
BUB.forEach(b => b.el = mk(stage, `left:0;top:0;width:${b.r * 2}px;height:${b.r * 2}px;border-radius:50%;border:2px solid rgba(160,230,255,.35);background:rgba(160,230,255,.06)`));
const art = mk(stage, `left:0;top:0;width:${W}px;height:${H}px`);
const scrim = mk(stage, `left:0;top:1380px;width:${W}px;height:540px;background:linear-gradient(180deg,rgba(5,8,22,0),rgba(5,8,22,.92) 38%)`);
const flash = mk(stage, `left:0;top:0;width:${W}px;height:${H}px;background:#fff;opacity:0;pointer-events:none`);
const tag = mk(stage, `left:0;top:1868px;width:${W}px;text-align:center;font-size:22px;color:${MUTE};letter-spacing:.14em;text-transform:uppercase`, 'Example leads, not real people');

/* ============ scene 1: fifty submissions ============ */
const NAMES = ['Dana K.', 'Marcus R.', 'Priya S.', 'Tom B.', 'Elena V.', 'Chris L.', 'Aisha M.', 'Jordan P.', 'Sofia G.', 'Ben H.', 'Mei W.', 'Luis F.', 'Hannah T.', 'Omar D.', 'Nina C.', 'Paul E.', 'Grace O.', 'Ivan Z.', 'Kara N.', 'Sam Y.'];
const LOW = ['$80', '$150', '$200', '$300', '$120', '$500', '$60', '$250', '$90', '$400', '$180', '$350'];
const rc = rng(21);
const cards = Array.from({ length: 50 }, (_, i) => {
  const col = i % 5, row = Math.floor(i / 5);
  const x = 60 + col * 195, y = 150 + row * 124;
  const el = mk(art, `left:${x}px;top:${y}px;width:180px;height:110px;${GLASS}border-radius:20px`);
  mk(el, `left:16px;top:16px;width:34px;height:34px;border-radius:50%;background:rgba(139,151,201,.35)`);
  mk(el, `left:60px;top:18px;font-size:22px;color:${WHITE}`, NAMES[i % 20], 'b');
  mk(el, `left:16px;top:62px;font-size:26px;color:${MUTE}`, 'Budget ' + LOW[Math.floor(rc() * LOW.length)], 'b');
  return { el, x, y, i, col, row, t0: 0.18 + i * 0.054, rot: (rc() - .5) * 8, jx: rc() * 6.28 };
});
const BIGCARD = 23;
const comb = mk(art, `left:0;top:110px;width:170px;height:1280px`, svg(170, 1280, `<rect x="60" y="0" width="50" height="1280" rx="25" fill="${VIOLET}"/>` + Array.from({ length: 34 }, (_, k) => `<rect x="${k % 2 ? 108 : 0}" y="${14 + k * 37}" width="62" height="14" rx="7" fill="${k % 2 ? '#a78bfa' : '#c4b5fd'}"/>`).join('')));
const spot = mk(art, `left:0;top:0;width:${W}px;height:1400px;`);
const inboxHud = mk(art, `left:60px;top:60px;width:960px;height:70px`);
const inboxNum = mk(inboxHud, `left:0;top:0;height:70px;border-radius:35px;padding:0 30px;${GLASS}font-size:34px;line-height:66px`, '', 'b');

/* ============ logo + rules panel (scenes 2 and 3) ============ */
const logoWrap = mk(art, `left:0;top:0;width:${W}px;height:300px`);
const logoImg = mk(logoWrap, `left:410px;top:20px;width:260px;height:260px;filter:drop-shadow(0 0 40px rgba(34,211,238,.55))`, '<img src="@LOGO@" style="width:260px;height:260px">');
const logoWord = mk(logoWrap, `left:0;top:230px;width:${W}px;text-align:center;font-size:104px;font-weight:700;letter-spacing:-.02em;text-shadow:0 0 50px rgba(34,211,238,.45)`, 'Jelly<span style="color:' + CYAN + '">Hook</span>');
const panel = mk(art, `left:90px;top:520px;width:900px;height:640px;${GLASS}border-radius:36px;transform-origin:50% 0`);
mk(panel, `left:40px;top:28px;font-size:44px`, 'Your rules', 'b');
mk(panel, `right:40px;top:30px;height:50px;border-radius:25px;padding:0 20px;background:rgba(139,92,246,.3);color:#c4b5fd;font-size:26px;line-height:50px`, 'Whale alert', 'b');
const RULES = [['Budget', 'dollar'], ['Time on page', 'clock'], ['Page', 'page']];
const ICON = {
  dollar: c => svg(54, 54, `<circle cx="27" cy="27" r="24" fill="none" stroke="${c}" stroke-width="4"/><text x="27" y="37" text-anchor="middle" font-size="30" font-weight="700" fill="${c}" font-family="Space Grotesk">$</text>`),
  clock: c => svg(54, 54, `<circle cx="27" cy="27" r="24" fill="none" stroke="${c}" stroke-width="4"/><path d="M27 12v16l10 6" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`),
  page: c => svg(54, 54, `<rect x="8" y="4" width="38" height="46" rx="6" fill="none" stroke="${c}" stroke-width="4"/><path d="M16 18h22M16 28h22M16 38h12" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`),
  bell: c => svg(54, 54, `<path d="M27 6c-9 0-14 7-14 16v10l-5 7h38l-5-7V22c0-9-5-16-14-16zM21 44a6 6 0 0 0 12 0" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>`),
  send: c => svg(54, 54, `<path d="M6 26 48 8 38 46 26 32zM26 32l22-24" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>`),
};
const dials = RULES.map(([lab, ic], i) => {
  const y = 130 + i * 160;
  const row = mk(panel, `left:30px;top:${y}px;width:840px;height:136px;border-radius:26px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1)`);
  const icon = mk(row, `left:30px;top:41px`, ICON[ic](MUTE));
  mk(row, `left:106px;top:22px;font-size:40px`, lab, 'b');
  const track = mk(row, `left:106px;top:90px;width:520px;height:12px;border-radius:6px;background:rgba(255,255,255,.14)`);
  const fill = mk(track, `left:0;top:0;height:12px;border-radius:6px;background:linear-gradient(90deg,${VIOLET},${CYAN})`);
  const knob = mk(track, `left:-16px;top:-10px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(34,211,238,.8)`);
  const tog = mk(row, `right:32px;top:38px;width:104px;height:56px;border-radius:28px;background:rgba(255,255,255,.18)`);
  const dot = mk(tog, `left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:#fff`);
  return { row, icon, fill, knob, tog, dot, t: [T.set, T.exact, T.rules][i], to: [.62, .38, .8][i], lab: ic };
});
const cross = mk(art, `left:0;top:0;width:200px;height:200px`, svg(200, 200, `<circle cx="100" cy="100" r="70" fill="none" stroke="${CYAN}" stroke-width="5"/><circle cx="100" cy="100" r="12" fill="${CYAN}"/><path d="M100 4v50M100 146v50M4 100h50M146 100h50" stroke="${CYAN}" stroke-width="5" stroke-linecap="round"/>`));
// the ideal lead (scene 3)
const ideal = mk(art, `left:90px;top:1190px;width:900px;height:180px;${GLASS}border-radius:34px`);
const ghost = mk(ideal, `left:34px;top:30px;width:120px;height:120px;border-radius:50%;border:4px dashed rgba(139,151,201,.7)`);
const ghostFill = mk(ghost, `left:0;top:0;width:112px;height:112px;border-radius:50%;background:linear-gradient(160deg,${CYAN},${VIOLET});opacity:0`);
mk(ideal, `left:182px;top:26px;font-size:42px`, 'The lead you want', 'b');
const CHK = ['Budget', 'Time', 'Page'].map((l, i) => mk(ideal, `left:${182 + i * 235}px;top:96px;height:52px;border-radius:26px;padding:0 22px;background:rgba(52,211,153,.18);color:${MINT};font-size:28px;line-height:48px;border:2px solid rgba(52,211,153,.5)`, '✓ ' + l, 'b'));

/* ============ scene 4: the whale ============ */
const water = mk(art, `left:0;top:900px;width:${W}px;height:700px;background:linear-gradient(180deg,rgba(34,211,238,.22),rgba(11,21,55,0))`);
const waves = mk(art, `left:0;top:880px;width:${W * 2}px;height:60px`, svg(W * 2, 60, `<path d="${Array.from({ length: 108 }, (_, k) => `${k ? 'L' : 'M'} ${k * 20} ${30 + 9 * Math.sin(k * .5)}`).join(' ')}" fill="none" stroke="rgba(160,230,255,.6)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`));
const stream = Array.from({ length: 9 }, (_, i) => mk(art, `left:0;top:1020px;width:130px;height:84px;${GLASS}border-radius:16px;font-size:24px;line-height:80px;text-align:center;color:${MUTE}`, LOW[i % 12], 'b'));
const WHALE_SVG = svg(560, 280, `<defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="${CYAN}"/></linearGradient></defs>
 <path d="M520 150 C520 70 400 22 270 30 C170 36 100 66 62 116 L8 70 C16 112 14 150 4 188 L62 156 C102 214 180 248 290 248 C420 248 520 214 520 150Z" fill="url(#wg)"/>
 <path d="M520 150 C500 196 410 226 300 226 C210 226 130 204 96 170 C150 190 240 198 330 188 C420 178 490 168 520 150Z" fill="rgba(255,255,255,.35)"/>
 <path d="M300 198 C320 240 360 262 400 270 C390 240 372 214 352 196Z" fill="#5b6bff"/>
 <circle cx="438" cy="118" r="11" fill="#0b1537"/><circle cx="441" cy="115" r="4" fill="#fff"/>
 <path d="M410 168c24 8 50 6 72-6" fill="none" stroke="#0b1537" stroke-width="5" stroke-linecap="round"/>`);
const whale = mk(art, `left:-280px;top:-140px;width:560px;height:280px`, `<div style="position:absolute;left:0;top:0;transform:scaleX(-1)">${WHALE_SVG}</div>`);
const spout = mk(art, `left:0;top:0;width:100px;height:120px`, svg(100, 120, `<path d="M50 120C50 70 30 50 8 36M50 120C50 70 70 50 92 36M50 120V20" fill="none" stroke="rgba(190,240,255,.8)" stroke-width="7" stroke-linecap="round"/>`));
const rings = Array.from({ length: 5 }, () => mk(art, `left:0;top:0;width:200px;height:60px;border-radius:50%;border:5px solid rgba(190,240,255,.8)`));
const pingR = Array.from({ length: 3 }, () => mk(art, `left:0;top:0;width:200px;height:200px;border-radius:50%;border:6px solid ${CYAN}`));
const tray = mk(art, `left:340px;top:1090px;width:400px;height:230px`, svg(400, 230, `<path d="M20 90 90 20H310L380 90V200a12 12 0 0 1-12 12H32a12 12 0 0 1-12-12Z" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.4)" stroke-width="5"/><path d="M20 100H130C136 140 164 156 200 156S264 140 270 100H380" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="5"/>`));
const trayBadge = mk(art, `left:0;top:0;width:100px;height:100px;border-radius:50%;background:${MINT};color:#04130c;font-size:60px;line-height:100px;text-align:center;box-shadow:0 0 50px rgba(52,211,153,.8)`, '1', 'b');
const phoneIcon = mk(art, `left:70px;top:1180px;width:110px;height:110px;border-radius:30px;${GLASS}`, svg(110, 110, `<rect x="34" y="22" width="42" height="66" rx="9" fill="none" stroke="${WHITE}" stroke-width="5"/><circle cx="55" cy="76" r="4" fill="${WHITE}"/>`));

/* ============ scene 5: the rule, built from the voice ============ */
const logo2 = mk(art, `left:390px;top:150px;width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(34,211,238,.55))`, '<img src="@LOGO@" style="width:300px;height:300px">');
const mic = mk(art, `left:90px;top:170px;width:900px;height:140px;${GLASS}border-radius:70px`);
const micDot = mk(mic, `left:24px;top:24px;width:92px;height:92px;border-radius:50%;background:linear-gradient(160deg,${VIOLET},${CYAN})`, svg(92, 92, `<rect x="34" y="18" width="24" height="40" rx="12" fill="#fff"/><path d="M24 46a22 22 0 0 0 44 0M46 68v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`));
const bars = Array.from({ length: 22 }, (_, i) => mk(mic, `left:${150 + i * 13}px;top:70px;width:8px;height:8px;border-radius:4px;background:${CYAN}`));
const micText = mk(mic, `left:150px;top:40px;font-size:56px`, '', 'b');
// the budget meter
const meter = mk(art, `left:90px;top:330px;width:900px;height:430px;${GLASS}border-radius:36px`);
mk(meter, `left:40px;top:28px;font-size:34px;color:${MUTE}`, 'Budget on the form', 'b');
const mNum = mk(meter, `left:40px;top:80px;font-size:128px;line-height:1;letter-spacing:-.03em`, '$0', 'b');
const mTrack = mk(meter, `left:40px;top:290px;width:820px;height:46px;border-radius:23px;background:rgba(255,255,255,.12)`);
const mFill = mk(mTrack, `left:0;top:0;height:46px;border-radius:23px`);
const mLine = mk(meter, `left:${40 + 820 * .62}px;top:262px;width:6px;height:112px;border-radius:3px;background:#fff`);
const mLab = mk(meter, `left:${40 + 820 * .62 - 90}px;top:372px;width:186px;text-align:center;font-size:32px;color:#fff`, '$4,000', 'b');
// the enterprise page + timer ring
const brow = mk(art, `left:90px;top:330px;width:900px;height:440px;${GLASS}border-radius:30px;overflow:hidden`);
mk(brow, `left:0;top:0;width:900px;height:68px;background:rgba(255,255,255,.08)`);
['#f472b6', '#facc15', '#34d399'].forEach((c, i) => mk(brow, `left:${26 + i * 30}px;top:24px;width:20px;height:20px;border-radius:50%;background:${c}`));
const url = mk(brow, `left:150px;top:12px;width:560px;height:44px;border-radius:22px;background:rgba(5,8,22,.6);font-size:26px;line-height:44px;padding-left:22px;color:${MUTE}`, 'yoursite.com/enterprise-services', 'b');
const hero = mk(brow, `left:40px;top:100px;width:500px;font-size:56px;line-height:1.08`, 'Enterprise<br>services', 'b');
const tiles = [0, 1, 2].map(i => mk(brow, `left:${40 + i * 170}px;top:300px;width:156px;height:110px;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12)`));
const ring = mk(brow, `left:590px;top:96px;width:280px;height:280px`, svg(280, 280, `<circle cx="140" cy="140" r="118" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="20"/><circle id="ringArc" cx="140" cy="140" r="118" fill="none" stroke="url(#rg)" stroke-width="20" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="741.4" transform="rotate(-90 140 140)"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${CYAN}"/><stop offset="1" stop-color="${MINT}"/></linearGradient></defs>`));
const ringTxt = mk(brow, `left:590px;top:176px;width:280px;text-align:center;font-size:76px;line-height:1`, '0:00', 'b');
mk(brow, `left:590px;top:262px;width:280px;text-align:center;font-size:26px;color:${MUTE}`, 'time on page');
// the submit
const form = mk(art, `left:90px;top:330px;width:900px;height:440px;${GLASS}border-radius:30px`);
mk(form, `left:40px;top:34px;font-size:34px;color:${MUTE}`, 'Contact us', 'b');

function seek(t) {

  const rich = seg(t, T.with_ - .1, T.with_ + .6);
  const dark = t < T.with_ ? 1 : 0;
  bg.style.background = `radial-gradient(120% 70% at 50% 0%,rgba(${Math.round(lerp(30, 40, rich))},${Math.round(lerp(40, 70, rich))},${Math.round(lerp(90, 160, rich))},1) 0%,${BG1} 45%,${BG0} 100%)`;
  RAYS.forEach((r, i) => { r.style.opacity = lerp(.25, 1, rich); r.style.transform = `rotate(${Math.sin(t * .4 + i) * 6 - 6 + i * 2}deg)`; });
  BUB.forEach(b => { const y = ((H + 40) - ((t * b.sp + b.ph * 200) % (H + 80))); b.el.style.transform = `translate(${b.x + Math.sin(t * 1.3 + b.ph) * 20}px,${y}px)`; b.el.style.opacity = .35 + .4 * rich; });
  flash.style.opacity = 0;
  const A_ = accAt(t);

  /* scene 1 ---------------------------------------------------------------- */
  const s1 = win(t, 0, T.with_ + .5, .1, .1);
  const combX = lerp(-220, 1160, ease(seg(t, T.comb - .1, T.comb + 1.05)));
  cards.forEach(c => {
    // scene 1 pile, the scene 7 return, then the flight out
    const drop = spring(t - c.t0, 15, .55);
    let o = clamp(drop * 2), x = 0, y = (1 - clamp(drop, 0, 1)) * -900, s = 1, r = c.rot * (1 - clamp(drop, 0, 1)) * 3;

  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 52) / H); stage.style.transform = `scale(${k})`; stage.style.left = Math.max(0, (innerWidth - W * k) / 2) + 'px'; };
  fit(); addEventListener('resize', fit);
  const ctl = document.createElement('div'); ctl.id = 'ctl';
  ctl.innerHTML = '<button id="pp">Play</button><input id="sc" type="range" min="0" max="' + DUR + '" step="0.01" value="0"><span id="tt">0.00</span>';
  document.body.appendChild(ctl);
  const au = new Audio('../../../../public/assets/set-rules.mp3');
  const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
  let playing = false;
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; if (playing) { au.currentTime = +sc.value; au.play(); } else au.pause(); };
  sc.oninput = () => { au.currentTime = +sc.value; seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); };
  (function loop() { if (playing) { sc.value = au.currentTime; if (au.currentTime >= DUR) { playing = false; pp.textContent = 'Play'; } } seek(+sc.value); tt.textContent = (+sc.value).toFixed(2); requestAnimationFrame(loop); })();
} else { stage.style.transform = 'none'; }
</script></body></html>
